<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
body{margin:0;background:#46178f;color:#fff;font-family:system-ui,sans-serif;text-align:center}
#app{max-width:900px;margin:auto;padding:16px}
#timer{position:fixed;top:10px;right:16px;font-size:2.2em;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.opt{color:#fff;border:none;border-radius:8px;padding:20px 12px;min-height:90px;font:inherit;font-size:1.3em;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:8px}
button.opt{cursor:pointer}
.big{background:#fff;color:#46178f;border:none;border-radius:8px;padding:14px 32px;font:inherit;font-size:1.3em;font-weight:bold;cursor:pointer;margin:12px}
input{font:inherit;font-size:1.3em;padding:12px;border-radius:8px;border:none;width:100%;max-width:320px;box-sizing:border-box}
.names span{display:inline-block;background:rgba(255,255,255,.2);border-radius:6px;padding:6px 12px;margin:4px}
ol{counter-reset:r;padding:0;text-align:left;max-width:420px;margin:auto;font-size:1.2em}
li{counter-increment:r;display:flex;justify-content:space-between;padding:4px 0}
li::before{content:counter(r) "º";margin-right:8px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:20px 0}
.pod>div{width:30%;max-width:160px}
.bar{background:rgba(255,255,255,.25);border-radius:8px 8px 0 0;font-size:2em;padding-top:8px}
.qr{display:inline-block;background:#fff;padding:12px;border-radius:8px;margin:8px}.qr svg{display:block;width:260px;height:260px}
.hd{opacity:.85;font-weight:bold}
.host h1{font-size:2.8em}.host h2{font-size:2.2em}
</style>
</head>
<body>
<script src="/qrcode.min.js"></script>
<div id="timer"></div>
<div id="app">Conectando…</div>
<script>
const key = new URLSearchParams(location.search).get('key');
if (key) document.body.className = 'host';
let id = null; try { id = localStorage.getItem('quizId'); } catch (e) {}
let S = null, last = '', err = '', sent = 0;
const C = ['#e21b3c', '#1368ce', '#d89e00', '#26890c'], SH = ['▲', '◆', '●', '■'], MED = ['🥇', '🥈', '🥉'];
const $ = q => document.querySelector(q);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const post = (u, b) => fetch(u, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b)}).then(r => r.json());
function qr(url) {
  if (typeof qrcode != 'function') return '';
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  return `<div class="qr">${q.createSvgTag({cellSize: 8, margin: 2})}</div>`;
}
const btn = t => `<button class="big" data-next>${t}</button>`;
const list = b => '<ol>' + b.map(p => `<li><span>${esc(p.name)}</span><b>${p.score}</b></li>`).join('') + '</ol>';
const podium = b => '<div class="pod">' + [1, 0, 2].filter(i => b[i]).map(i =>
  `<div><div>${esc(b[i].name)}<br><b>${b[i].score}</b></div><div class="bar" style="height:${[160, 110, 80][i]}px">${MED[i]}</div></div>`).join('') + '</div>';
function opts(s, click) {
  const tag = click ? 'button' : 'div';
  return '<div class="grid">' + s.options.map((o, i) =>
    `<${tag} class="opt" ${click ? 'data-a="' + i + '"' : ''} style="background:${C[i]};${s.phase == 'reveal' && i != s.correct ? 'opacity:.35' : ''}">${SH[i]} ${esc(o)}${s.phase == 'reveal' ? ' · ' + s.counts[i] + (s.counts[i] == 1 ? ' participante' : ' participantes') : ''}</${tag}>`).join('') + '</div>';
}
function hostView(s) {
  if (s.phase == 'lobby') return `<h1>Entre em ${esc(s.url)}</h1>${qr(s.url)}<p>${s.players} jogador(es)</p><div class="names">${(s.names || []).map(n => `<span>${esc(n)}</span>`).join('')}</div>` + btn('Começar');
  if (s.phase == 'question') return `<p>Pergunta ${s.n}/${s.total}</p><h2>${esc(s.question)}</h2>` + opts(s) + `<p>${s.answered}/${s.players} responderam</p>` + btn('Encerrar pergunta');
  if (s.phase == 'reveal') return `<h2>${esc(s.question)}</h2>` + opts(s) + '<h3>Placar</h3>' + list(s.board) + btn(s.n == s.total ? 'Resultado final' : 'Próxima');
  return '<h1>🏆 Resultado</h1>' + podium(s.board) + list(s.board);
}
function playerView(s) {
  const me = s.me;
  if (!me) return `<h1>Quiz</h1><input id="name" maxlength="12" placeholder="Seu nome"><br><button class="big" data-join>Entrar</button><p>${esc(err)}</p>`;
  let h = `<p class="hd">${esc(me.name)} · ${me.score} pts</p>`;
  if (s.phase == 'lobby') return h + '<h2>Você está dentro! Aguarde o início…</h2>';
  if (s.phase == 'question') return h + (me.answered || sent === s.n ? '<h2>Resposta enviada! ⏳</h2>' : `<h2>${esc(s.question)}</h2>` + opts(s, true));
  if (s.phase == 'reveal') return h + `<h1>${me.right ? '✅ Correto! +' + me.gained : '❌ Não foi dessa vez'}</h1><h2>Você está em ${me.rank}º lugar</h2>`;
  return h + `<h1>Você ficou em ${me.rank}º lugar!</h1>` + podium(s.board);
}
function render() {
  if (!S) return;
  if (S.phase != 'question') sent = 0;
  $('#timer').textContent = S.phase == 'question' ? Math.ceil(S.remaining) : '';
  const html = key ? hostView(S) : playerView(S);
  if (html === last) return;
  const typed = $('#name') && $('#name').value;
  $('#app').innerHTML = last = html;
  if (typed && $('#name')) $('#name').value = typed;
}
async function poll() {
  try {
    const used = id;
    S = await (await fetch('/state' + (used ? '?id=' + encodeURIComponent(used) : ''))).json();
    if (!key && used && !S.me && used === id) { id = null; try { localStorage.removeItem('quizId'); } catch (e) {} }
    render();
  } catch (e) {}
  setTimeout(poll, 500);
}
$('#app').onclick = async e => {
  const t = e.target.closest('button'); if (!t) return;
  try {
    if ('next' in t.dataset) { const r = await post('/next', {key}); if (r.error) alert(r.error + ' — abra o link de apresentador mostrado no terminal.'); }
    else if ('join' in t.dataset) {
      const r = await post('/join', {name: $('#name').value});
      if (r.id) { id = r.id; err = ''; try { localStorage.setItem('quizId', id); } catch (e) {} } else err = r.error || 'Erro';
      render();
    } else if ('a' in t.dataset) { sent = S.n; render(); await post('/answer', {id, choice: +t.dataset.a}); }
  } catch (e) {}
};
$('#app').onkeydown = e => { if (e.key == 'Enter' && e.target.id == 'name') $('[data-join]').click(); };
poll();
</script>
</body>
</html>
